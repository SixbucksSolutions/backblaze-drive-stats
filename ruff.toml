target-version = "py315"
line-length = 100
extend-exclude = ["data", ".venv", "web/node_modules", "web/dist"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "ISC001", "PGH003", "PGH004"]

# Named dict construction and unpacking preferences are stylistic.
# Separate resource scopes remain useful for explanatory comments in CLI/tests.
ignore = ["C408", "RUF005", "RUF007", "SIM117"]

[format]
# This module's exact bytes form the historical cache normalization identity.
exclude = ["drive_model_names.py"]
