<!doctype html>
<html lang="en" class="app-pending">
  <head>
    <meta charset="UTF-8" />
    <script id="startup-policy">
      // Match viewUsesSpinner in app-route.ts before the first possible paint.
      // New and unknown views default to no spinner.
      const startupView = new URLSearchParams(location.search).get('view');
      if (startupView !== null && startupView !== 'picks') {
        document.documentElement.classList.add('analytics-route');
      }
      if (new URLSearchParams(location.search).get('view') === 'matrix') {
        document.documentElement.classList.add('matrix-startup');
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183c40" />
    <meta
      name="description"
      content="Explore Backblaze drive reliability, deployments, fleet composition, and capacity by quarter."
    />
    <title>Drive Stats — Quarterly explorer</title>
    <link
      rel="preload"
      href="%BASE_URL%fonts/InterVariable-4.1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/fonts.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/published-navigation.css" />
    <link rel="stylesheet" href="/src/owner-picks.css" />
    <style>
      html {
        background: #f5f6f2;
        --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-table: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }
      /* The complete view enters only after the loading status has faded away. */
      #app {
        opacity: 1;
        visibility: visible;
      }
      .matrix-startup #app {
        transition:
          opacity 200ms ease-out 150ms,
          visibility 0s linear 150ms;
      }
      .analytics-route #static-picks-root {
        display: none;
      }
      .app-pending #app {
        visibility: hidden;
        opacity: 0;
        transition: none;
      }
      #startup-status {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        box-sizing: border-box;
        padding: 24px;
        text-align: center;
        color: #183c40;
        font:
          600 24px system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        opacity: 0;
        visibility: hidden;
        pointer-events: auto;
        transition:
          opacity 150ms ease-in,
          visibility 0s linear 150ms;
      }
      .matrix-startup #startup-status {
        display: flex;
      }
      .matrix-startup.app-pending #startup-status {
        opacity: 1;
        visibility: visible;
        transition: none;
      }
      .startup-spinner {
        width: 64px;
        height: 64px;
        border: 4px solid #c9d9d6;
        border-top-color: #183c40;
        border-radius: 50%;
      }
      .matrix-startup.app-pending .startup-spinner {
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .matrix-startup #app,
        .matrix-startup #startup-status {
          transition: none;
        }
        .matrix-startup.app-pending .startup-spinner {
          animation: none;
        }
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="startup-status" role="status">
      <span class="startup-spinner" aria-hidden="true"></span>Preparing Drive Stats…
    </div>
    <div id="app"></div>
    <noscript
      ><style>
        .app-pending #startup-status {
          display: none;
        }
      </style>
      <p>This data explorer needs JavaScript to load its reports.</p></noscript
    >
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
