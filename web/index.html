<!doctype html>
<html lang="en" class="app-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183c40" />
    <meta
      name="description"
      content="Explore Backblaze drive reliability, deployments, fleet composition, and capacity by quarter."
    />
    <title>Drive Stats — Quarterly explorer</title>
    <link
      rel="preload"
      href="%BASE_URL%fonts/InterVariable-4.1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/JetBrainsMono-Regular-2.304.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%fonts/JetBrainsMono-SemiBold-2.304.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/fonts.css" />
    <style>
      html {
        background: #f5f6f2;
        --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-table: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }
      .app-pending #app {
        visibility: hidden;
      }
      #startup-status {
        display: none;
      }
      .app-pending #startup-status {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        box-sizing: border-box;
        padding: 24px;
        text-align: center;
        color: #183c40;
        font:
          600 24px system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .startup-spinner {
        width: 64px;
        height: 64px;
        border: 4px solid #c9d9d6;
        border-top-color: #183c40;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner {
          animation: none;
        }
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="startup-status" role="status">
      <span class="startup-spinner" aria-hidden="true"></span>Preparing Drive Stats…
    </div>
    <div id="app"></div>
    <noscript
      ><style>
        .app-pending #startup-status {
          display: none;
        }
      </style>
      <p>This data explorer needs JavaScript to load its reports.</p></noscript
    >
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
